name: Flask Kubernetes CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-kubernetes-sprint:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-kubernetes-sprint:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-kubernetes-sprint:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-kubernetes-sprint:latest
  ssh-test:
    name: Test EC2 SSH Connection
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to EC2 successfully"
            hostname
            whoami
            kubectl get nodes
            minikube status
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy application to EC2 Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/flask-kubernetes-sprint

            echo "Pulling latest code..."
            git pull origin main

            echo "Applying Kubernetes manifests..."
            kubectl apply -f k8s/namespace.yaml
            kubectl apply -f k8s/configmap.yaml
            kubectl apply -f k8s/secret.yaml
            kubectl apply -f k8s/pvc.yaml
            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/service.yaml
            kubectl apply -f k8s/backend-deployment.yaml
            kubectl apply -f k8s/backend-service.yaml

            echo "Updating backend image..."
            kubectl set image deployment/flask-backend \
              flask-backend=${{ secrets.DOCKERHUB_USERNAME }}/flask-kubernetes-sprint:${{ github.sha }} \
              -n flask-sprint

            echo "Waiting for rollout..."
            kubectl rollout status deployment/flask-backend \
              -n flask-sprint --timeout=120s

            echo "Checking application..."
            kubectl get pods -n flask-sprint
            kubectl get services -n flask-sprint

            echo "Deployment successful!"
